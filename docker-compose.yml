services:
  uptime-oco:
    build:
      context: .
      dockerfile: uptime-oco/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__UptimeOcoContext=Data Source=/app/data/uptime-oco.db
    volumes:
      - oco-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  oco-data:
