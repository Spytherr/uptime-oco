services:
  uptime-oco:
    build:
      context: .
      dockerfile: uptime-oco/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__UptimeOcoContext=Data Source=/app/data/uptime-oco.db
    volumes:
      - oco-data:/app/data
    restart: unless-stopped

volumes:
  oco-data:
